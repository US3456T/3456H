<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 智能数据大屏分析</title>
    <meta name="description" content="全免费、低配置、网页直接使用的 AI 智能数据大屏分析工具，支持 CSV 上传和趋势统计。" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dashboard-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-icon">AI</div>
          <div>
            <div class="eyebrow">FREE · LIGHT · WEB</div>
            <h1>智能数据分析大屏</h1>
          </div>
        </div>

        <div class="top-actions">
          <button id="demoBtn" class="btn btn-light">加载示例</button>
          <label class="btn btn-primary file-picker">
            <input id="fileInput" type="file" accept=".csv,text/csv" />
            上传 CSV
          </label>
          <button id="copyBtn" class="btn btn-dark">复制报告</button>
        </div>
      </header>

      <section class="hero-panel">
        <div>
          <div class="small-tag">智能分析中心</div>
          <h2>历史走势 · 趋势跟踪 · 关键洞察 · 智能建议</h2>
        </div>

        <div class="legend-group">
          <span>免费版</span>
          <span>低配置</span>
          <span>网页使用</span>
          <span>无安装</span>
        </div>
      </section>

      <section class="control-strip">
        <button class="range-btn active" data-range="all">全部</button>
        <button class="range-btn" data-range="6">近 6 期</button>
        <button class="range-btn" data-range="3">近 3 期</button>
      </section>

      <section class="stats-grid">
        <article class="stat-card blue">
          <div class="stat-label">总记录数</div>
          <div id="totalRows" class="stat-value">0</div>
        </article>
        <article class="stat-card green">
          <div class="stat-label">平均值</div>
          <div id="avgValue" class="stat-value">0</div>
        </article>
        <article class="stat-card orange">
          <div class="stat-label">中位数</div>
          <div id="medianValue" class="stat-value">0</div>
        </article>
        <article class="stat-card purple">
          <div class="stat-label">增长率</div>
          <div id="growthRate" class="stat-value">0%</div>
        </article>
        <article class="stat-card pink">
          <div class="stat-label">峰值</div>
          <div id="peakValue" class="stat-value">0</div>
        </article>
        <article class="stat-card cyan">
          <div class="stat-label">波动度</div>
          <div id="volatility" class="stat-value">0</div>
        </article>
      </section>

      <main class="main-grid">
        <section class="panel chart-panel">
          <div class="panel-header">
            <h3>趋势走势图</h3>
          </div>
          <div class="chart-box">
            <svg id="trendChart" viewBox="0 0 760 300" preserveAspectRatio="none"></svg>
          </div>
        </section>

        <aside class="panel ai-panel">
          <div class="panel-header">
            <h3>AI 智能分析</h3>
          </div>
          <div id="aiReport" class="ai-report">
            <p>请上传 CSV 或点击加载示例数据。</p>
          </div>
        </aside>
      </main>

      <section class="panel table-panel">
        <div class="panel-header">
          <h3>数据明细</h3>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th>数值</th>
                <th>增幅</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
